<!doctype html>
<html lang="en" data-mode="tech" data-theme="dark" data-fx="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script>
  // Pre-paint state (DevLog-005): mode and theme from ?mode= / ?theme=, else localStorage, else tech / dark.
  // BABY (DevLog-007): baby.css hides main and shows the book stage from this attribute. data-fx = VISUAL and no reduced motion. Runs before any stylesheet applies, so there is no flash or shift.
  (function () {
    var r = document.documentElement, q = new URLSearchParams(location.search), get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var pick = function (v, ok, d) { return ok.indexOf(v) >= 0 ? v : d; };
    r.dataset.theme = pick(q.get("theme") || get("ln-theme") || "dark", ["dark", "light"], "dark");
    r.dataset.mode = pick(q.get("mode") || get("ln-mode") || "tech", ["tech", "visual", "baby"], "tech");
    var rm = false; try { rm = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    r.dataset.fx = r.dataset.mode === "visual" && !rm ? "on" : "off";
    // FIX-S G04: preload the Latin files of the critical faces of the active mode (the same URLs the Google Fonts CSS below
    // serves on 2026-10-25; if Google moves a family to a new version the preload is only a wasted fetch, and the
    // metric-matched fallbacks in tech.css keep the swap shift-free).
    var g = "https://fonts.gstatic.com/s/", f = r.dataset.mode !== "tech"
      ? ["newsreader/v26/cY9AfjOCX1hbuyalUrK4397yjIJFJpc.woff2", "inter/v20/UcCo3FwrK3iLTcviYwYZ8UA3.woff2"]
      : ["ibmplexsans/v23/zYXzKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1syxeKYbSB4Zh.woff2", "ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q131nj-o.woff2"];
    for (var i = 0; i < f.length; i++) { var l = document.createElement("link"); l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous"; l.href = g + f[i]; document.head.appendChild(l); }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- FIX-S G04: VISUAL faces use display=block (text waits for the preloaded face, at most the 3 s block period): Newsreader
     line breaks differ from any fallback word by word, so a swap reflowed paragraphs even with metric-matched fallbacks.
     TECH faces keep swap (the matched Plex fallbacks reflow nothing measurable). -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,400&family=STIX+Two+Text:ital@0;1&display=block" rel="stylesheet">
%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>

- id: c03-calc
  type: computation
  title: "Independent check of the derived values from the Kushibiki et al. 1999 constants, 2026-10-25"
  content: "Python/NumPy/SciPy, not committed. (1) e, c^E, eps^S -> s^E, d, g, h, c^D, eps^T; (2) Christoffel with stiffening (ieee176 Eq. 47); (3) partial-wave SAW, 8x8 generalized eigenproblem, nondimensionalized, Im(alpha) < 0 or Poynting into the substrate, boundary determinant minimized over real v (Rayleigh) or complex v (leaky), 1 m/s exclusion around bulk thresholds; (4) photoelastic longitudinal coefficient p_ijkl b_i b_j b_k b_l; (5) arithmetic checks (Bragg, IDT f0, thermal occupation). Inputs: kushibiki1999 with c66 = (c11 - c12)/2; alternates ogi2002, warner1967 (rho 4700, eps^S 44.3/27.9)"

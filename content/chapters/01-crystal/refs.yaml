  read: "Ch. 1 (pp. 1-7), Ch. 2 (pp. 9-49), Sec. 3.2.1 (pp. 59-60), Sec. 6.1 (pp. 139-143), Ch. 7 selected (pp. 164-200); reference list entries checked for every original cited here (author's local copy)"

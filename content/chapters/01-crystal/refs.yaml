- id: volk2008
  citation: "T. Volk, M. Woehlecke, Lithium Niobate: Defects, Photorefraction and Ferroelectric Switching, Springer Series in Materials Science 115 (Springer, Berlin Heidelberg, 2008)"
  doi: 10.1007/978-3-540-70766-0

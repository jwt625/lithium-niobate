# History events, lithium niobate, 1801-2026
# Lane C07, compiled 2026-10-25. Merge target: data/events/history.yaml.
#
# Fields: id (merge key, added for cross-reference), date, date_precision, title, people,
# institution, citation, doi, url, status, hook (<= 20 words), chapter, notes.
#
# date: ISO 8601. Day, month or year as precise as the source allows. Ranges use the ISO
#   interval form "start/end".
# date_precision: day | month | year | approx | range
#   Publication dates are issue dates from Crossref (published-print, else issued) unless
#   notes say otherwise.
# status:
#   V  Crossref record, publisher abstract, archival scan, or the issuing organization's own
#      page confirms the publication or announcement; the claim restates its title, abstract
#      or text. Vendor performance numbers stay vendor claims even when V.
#   P  Publication confirmed; its link to the stated LN claim, or a detail such as
#      affiliation, rests on a secondary source (named in notes).
#   S  Secondary source only: trade press, retrospective, catalog, company profile in a third
#      party directory, or a search snippet (named in notes).
#   derived  Count or calculation made from cited data (method in notes).
# institution: as printed on the byline when notes say "byline"; otherwise standard
#   attribution, not re-checked.
# chapter: h01 A crystal on paper; h02 Bell Labs grows a crystal; h03 The damage that became
#   a memory; h04 Sound on a crystal; h05 Light in a channel; h06 Taming the crystal; h07 The
#   internet's modulator; h08 Peeling the crystal; h09 The thin-film renaissance; h10 Into the
#   AI data center.
# Items that could not be verified are not listed here; see open-questions.md.

events:

# ---------------------------------------------------------------- h01 A crystal on paper

- id: h-1801-hatchett-columbium
  date: "1801-11-26"
  date_precision: day
  title: "Hatchett reports a new metal in a North American mineral and names it columbium"
  people: ["Charles Hatchett"]
  institution: "Royal Society of London (paper read)"
  citation: "C. Hatchett, Phil. Trans. R. Soc. Lond. 92, 49-66 (1802)"
  doi: "10.1098/rstl.1802.0005"
  url: "https://archive.org/details/s3id13528400"
  status: V
  hook: "A London chemist finds an unknown metal in an American mineral and calls it columbium."
  chapter: h01
  notes: "Read 1801-11-26, printed 1802. Naming sentence p. 65: 'I have been induced to give it the name of Columbium.' Scan read on archive.org; Crossref record confirms volume and pages. The element is niobium; the name columbium persisted in US metallurgy."

- id: h-1802-ekeberg-tantalum
  date: "1802"
  date_precision: year
  title: "Ekeberg names tantalum after Tantalus"
  people: ["Anders Gustaf Ekeberg"]
  institution: "Uppsala (attribution)"
  citation: "Kongl. Vetenskaps Academiens Nya Handlingar 1802, p. 68 (as cited by Wollaston 1809 and Rose 1844)"
  doi: null
  url: null
  status: P
  hook: "Tantalus could never drink; Ekeberg's new oxide could not take up acid, so he named it tantalum."
  chapter: h01
  notes: "Original Swedish paper not found online. The naming reason is as reported by Rose 1844 (Ann. Phys. 139, p. 318): the oxide is insoluble in excess acid, 'Wegen dieser Eigenschaft nannte er das ... Metall Tantal'."

- id: h-1809-wollaston-identity
  date: "1809"
  date_precision: year
  title: "Wollaston argues columbium and tantalum are the same element"
  people: ["William Hyde Wollaston"]
  institution: "London"
  citation: "W. H. Wollaston, 'On the identity of columbium and tantalum', Phil. Trans. R. Soc. Lond. 99, 246-252 (1809)"
  doi: "10.1098/rstl.1809.0017"
  url: null
  status: V
  hook: "For 35 years chemists believed niobium and tantalum were one metal."
  chapter: h01
  notes: "Crossref record and abstract (first paragraph). The error held until Rose 1844."

- id: h-1818-arfwedson-lithium
  date: "1818-02-09"
  date_precision: day
  title: "Lithium announced: Arfwedson finds a new alkali in petalite; Berzelius names it from Greek lithos"
  people: ["Johan August Arfwedson", "Jons Jacob Berzelius"]
  institution: "Berzelius laboratory, Stockholm"
  citation: "Berzelius, letter dated 1818-02-09, Ann. Chim. Phys. 7, 199-201; A. Arfwedson, Afhandlingar i Fysik, Kemi och Mineralogi 6, 145-172 (Stockholm 1818)"
  doi: null
  url: "https://archive.org/details/bub_gb_71QrAAAAcAAJ"
  status: V
  hook: "Lithium means stone: Berzelius named it for being found in a mineral."
  chapter: h01
  notes: "Scans read: Arfwedson p. 153, Berzelius proposed 'Lithion' after the Greek for stone 'efter som detta alkali forst blifvit funnit i mineralriket'. Berzelius letter scan: archive.org/details/s3id13207740 (volume title page 1817, letter dated 1818-02-09). The discovery itself is commonly dated 1817 (secondary: Weeks, J. Chem. Educ. 9, 1035, 1932, doi:10.1021/ed009p1035)."

- id: h-1844-rose-niobium
  date: "1844-10-31"
  date_precision: day
  title: "Heinrich Rose names niobium after Niobe, daughter of Tantalus"
  people: ["Heinrich Rose"]
  institution: "Berlin (Royal Prussian Academy of Sciences, paper read)"
  citation: "H. Rose, 'Ueber die Zusammensetzung der Tantalite und ein im Tantalite von Baiern enthaltenes neues Metall', Ann. Phys. Chem. (Poggendorff) 63 = Ann. Phys. 139, 317-341 (1844); Bericht Akad. Wiss. Berlin 1844, 361-364"
  doi: "10.1002/andp.18441391006"
  url: "https://archive.org/details/annalenderphysi88pogggoog"
  status: V
  hook: "Niobium is named for Niobe, daughter of Tantalus, to mark its likeness to tantalum."
  chapter: h01
  notes: "Naming sentence pp. 335-336: 'Ich nenne dasselbe Niobium und sein Oxyd Niobsaure, von Niobe, der Tochter des Tantalus, um durch den Namen die Aehnlichkeit ... anzudeuten.' Read to the Berlin Academy 1844-10-31 (Bericht scan, archive.org/details/BerichtUberDieZurBekanntmachung1844). Resolves the 1844 vs 1846 question: niobium 1844, pelopium 1846."

- id: h-1846-rose-pelopium
  date: "1846-07-16"
  date_precision: day
  title: "Rose names a second 'new metal' pelopium after Pelops, Niobe's brother"
  people: ["Heinrich Rose"]
  institution: "Berlin (Royal Prussian Academy of Sciences, paper read)"
  citation: "H. Rose, 'Ueber ein zweites im Tantalit (Columbit) von Baiern enthaltenes neues Metall', Ann. Phys. 145, 115-141 (1846)"
  doi: "10.1002/andp.18461450911"
  url: "https://archive.org/details/annalenderphysi84unkngoog"
  status: V
  hook: "Rose named a second metal after Niobe's brother Pelops; it turned out to be niobium again."
  chapter: h01
  notes: "Naming p. 119: 'Pelopium nennen, von Pelops, dem Sohne des Tantalus, und dem Bruder der Niobe'. Read 1846-07-16 (Bericht Akad. Wiss. Berlin 1846, 229-230). Secondary sources that give '1846' for niobium conflate the two papers."

- id: h-1866-marignac-niobium
  date: "1866"
  date_precision: year
  title: "Marignac settles niobium chemistry; pelopium and 'ilmenium' are not new elements"
  people: ["Jean Charles Galissard de Marignac"]
  institution: "Geneva"
  citation: "C. Marignac, 'Recherches sur les combinaisons du niobium', Ann. Chim. Phys. (4) 8, 5-75 (1866)"
  doi: null
  url: "https://archive.org/details/s696id13664940"
  status: V
  hook: "Two decades after Rose, a Geneva chemist untangled niobium from tantalum for good."
  chapter: h01
  notes: "Scan pp. 5-8, 45-50. Marignac p. 6: Rose himself 'reconnut que ces deux acides renfermaient un meme metal'; p. 45 the white chloride is NbOCl3; p. 50 Nb-Ta association caused Rose's errors and credits Blomstrand's parallel work (1864-1865). Reprints notices from Archives des sciences physiques et naturelles, Geneva, 1865-1866."

- id: h-1917-czochralski
  date: "1917-04-24"
  date_precision: day
  title: "Czochralski publishes the crystal-pulling method (as a way to measure metal crystallization speed)"
  people: ["Jan Czochralski"]
  institution: "Berlin (AEG laboratory, attribution)"
  citation: "J. Czochralski, 'Ein neues Verfahren zur Messung der Kristallisationsgeschwindigkeit der Metalle', Z. Phys. Chem. 92, 219-221"
  doi: "10.1515/zpch-1918-9212"
  url: "https://archive.org/details/sim_zeitschrift_physikalische_chemie_1917-04-24_92_2"
  status: V
  hook: "The method that grows lithium niobate boules began as a speed test for molten metals."
  chapter: h01
  notes: "Received 1916-08-19; Heft 2 'Ausgegeben am 24. April 1917'; volume 92 spans 1916-11 to 1918-06, so Crossref and most citations give 1918. Melt in a charcoal crucible; a thin crystal thread pulled at the maximum continuous speed. The 1916 'pen dipped in molten tin' story is an anecdote (secondary: Malecka, ACADEMIA 4(40), 2013); origin unverified."

- id: h-1928-zachariasen
  date: "1928"
  date_precision: year
  title: "Zachariasen's structure survey of sesquioxides and ABO3 compounds lists LiNbO3"
  people: ["W. H. Zachariasen"]
  institution: "University of Oslo (doctoral thesis)"
  citation: "W. H. Zachariasen, 'Untersuchungen uber die Kristallstruktur von Sesquioxyden und Verbindungen ABO3', Skr. Nor. Vidensk.-Akad. Oslo, Mat.-Naturv. Kl. 1928, No. 4, 165 pp."
  doi: null
  url: null
  status: P
  hook: "A Norwegian doctoral thesis on oxide crystal structures includes LiNbO3, according to later citations."
  chapter: h01
  notes: "Thesis scan not seen. LiNbO3 content confirmed only by citing papers: Matthias & Remeika 1949 ('LiCbO3 ... was described by Zachariasen as belonging to the ilmenite structure'), Abrahams 1966, Bartasyte 2017 (doi:10.1002/admi.201600998). One library catalog gives the series volume imprint as 1929."

- id: h-1949-matthias-remeika
  date: "1949-12-15"
  date_precision: day
  title: "Matthias and Remeika find ferroelectricity in LiNbO3 and LiTaO3"
  people: ["B. T. Matthias", "J. P. Remeika"]
  institution: "Bell Telephone Laboratories, Murray Hill (byline)"
  citation: "B. T. Matthias, J. P. Remeika, 'Ferroelectricity in the Ilmenite Structure', Phys. Rev. 76, 1886-1887 (1949)"
  doi: "10.1103/PhysRev.76.1886.2"
  url: "https://archive.org/details/sim_physical-review_1949-12-15_76_12"
  status: V
  hook: "Two Bell Labs physicists find a crystal with a built-in electric arrow that a field can flip."
  chapter: h01
  notes: "Full letter read (scan). Dated 1949-11-07. 'Single crystals of LiTaO3 and LiCbO3 have been found to be strongly ferroelectric'; ceramics 'show hardly any effect'. Written with the old symbol Cb (columbium). Crystal growth method not stated in the letter. Note DOI suffix .2: 10.1103/PhysRev.76.1886 is a different paper."

- id: h-1949-iupac-niobium
  date: "1949"
  date_precision: year
  title: "The name niobium chosen internationally over columbium"
  people: []
  institution: "IUPAC (15th Conference, Amsterdam)"
  citation: "G. Rayner-Canham, J. Zheng, Found. Chem. 10, 13-18 (2008); vanderkrogt.net element 41"
  doi: "10.1007/s10698-007-9042-1"
  url: "https://www.vanderkrogt.net/elements/element.php?num=41"
  status: S
  hook: "After 148 years and two names, chemists agreed to call the metal niobium."
  chapter: h01
  notes: "Chosen at the 1949 conference, accepted by IUPAC in 1950 (secondary). Conference proceedings not located. 'Columbium' persists in some US metallurgical usage (secondary)."

- id: h-1958-reisman-holtzberg
  date: "1958-12"
  date_precision: month
  title: "Li2O-Nb2O5 phase diagram"
  people: ["Arnold Reisman", "Frederic Holtzberg"]
  institution: "IBM (attribution)"
  citation: "A. Reisman, F. Holtzberg, J. Am. Chem. Soc. 80, 6503-6507 (1958)"
  doi: "10.1021/ja01557a010"
  url: null
  status: V
  hook: "A map of how lithium oxide and niobium oxide melt and freeze together."
  chapter: h01
  notes: "Title: 'Heterogeneous Equilibria in the Systems Li2O-, Ag2O-Nb2O5 and Oxide-Models'. A liquidus maximum near 48.6 mol% Li2O is attributed to this paper by a 2021 review (PMC8617696, via R07), not read here; the 48.6 mol% congruent value is sourced to Carruthers 1971."


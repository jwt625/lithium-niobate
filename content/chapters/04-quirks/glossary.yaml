# Chapter 04 Quirks: glossary
# Fields: term, abbr (optional), definition (one or two sentences, no numbers unless sourced), sections, source (refs.yaml id, optional)

- term: photorefractive effect
  abbr: PRE
  definition: "Light-induced change of refractive index caused by photoexcited charge that moves, is retrapped, and sets up a space-charge field acting through the Pockels effect. Reversible by uniform light or heat."
  sections: ["4.1", "4.3"]
  source: volk2008
- term: optical damage
  definition: "Original name (1966) for photorefraction in LiNbO3; today also used loosely for coloration and laser-induced breakdown, which are different effects."
  sections: ["4.1", "4.5"]
  source: volk2008
- term: photorefractive damage
  abbr: PRD
  definition: "Photorefraction when it is unwanted: beam distortion and scattering by the beam's own index change."
  sections: ["4.1", "4.2"]
  source: schwesyg2011
- term: bulk photovoltaic effect
  definition: "Steady current generated by uniform illumination in a noncentrosymmetric crystal without applied field or junction; in LiNbO3 it flows mainly along c and drives photorefraction. Also called the photogalvanic effect or Glass current."
  sections: ["4.1"]
  source: glass1974
- term: Glass constant
  abbr: k_G
  definition: "Scalar coefficient in j_pv = k_G alpha I linking photovoltaic current density to absorbed intensity."
  sections: ["4.1"]
  source: volk2008
- term: photovoltaic tensor
  abbr: beta_ijk
  definition: "Third-rank tensor in j_i = beta_ijk e_j e_k I; for point group 3m its symmetric part has the same nonzero pattern as the piezoelectric d tensor."
  sections: ["4.1"]
  source: volk2008
- term: space-charge field
  abbr: E_sc
  definition: "Electric field of the separated photoexcited charge and the ionized centers it left behind."
  sections: ["4.1"]
- term: dielectric relaxation time
  abbr: tau_di
  definition: "Time eps eps0 / sigma over which free charge screens a field in a medium of conductivity sigma; sets photorefractive write, erase, and drift times."
  sections: ["4.1", "4.6", "4.7"]
  source: volk2008
- term: dark conductivity
  abbr: sigma_d
  definition: "Conductivity without illumination; in undoped LiNbO3 carried mainly by protons."
  sections: ["4.1", "4.7"]
  source: volk2008
- term: photoconductivity
  abbr: sigma_ph
  definition: "Conductivity added by illumination, proportional to intensity at moderate intensity (sigma_ph = kappa I, kappa the specific photoconductivity)."
  sections: ["4.1", "4.2"]
  source: schwesyg2011
- term: diffusion field
  definition: "Space-charge field set up by diffusion of carriers from bright to dark fringes; independent of intensity and shifted a quarter period from the light pattern."
  sections: ["4.1"]
  source: volk2008
- term: Kukhtarev model
  definition: "Band-transport rate equations (generation, recombination, drift, diffusion, photovoltaic current, Gauss law) for photorefractive gratings."
  sections: ["4.1"]
  source: kukhtarev1978
- term: two-center model
  definition: "Charge-transport scheme in LiNbO3 with a deep trap (for example Fe) and the Nb antisite as a shallow electron trap."
  sections: ["4.1"]
  source: volk2008
- term: Nb antisite
  abbr: Nb_Li
  definition: "Nb ion on a Li site, present in Li-deficient (congruent) crystals; electron trap and host of the bound small polaron."
  sections: ["4.2", "4.4"]
  source: volk2008
- term: small polaron
  definition: "Electron (or hole) localized on one lattice site by the lattice distortion it creates; absorbs light in a broad band by hopping to a neighbor site."
  sections: ["4.4"]
  source: schwesyg2011
- term: bound small polaron
  abbr: Nb_Li^4+
  definition: "Electron trapped on a Nb antisite; absorption band near 1.6 eV; cause of GRIIRA."
  sections: ["4.4"]
  source: schwesyg2011
- term: free small polaron
  abbr: Nb_Nb^4+
  definition: "Electron self-trapped on a regular Nb site; absorption band near 1.0 eV."
  sections: ["4.4"]
  source: schwesyg2011
- term: bipolaron
  definition: "Electron pair bound on a neighboring Nb_Li-Nb_Nb pair; stable in reduced crystals; absorption band near 2.5 eV."
  sections: ["4.4"]
  source: schwesyg2011
- term: hole polaron
  abbr: O^-
  definition: "Hole trapped on an oxygen ion next to a Li vacancy; broad absorption near 500 nm."
  sections: ["4.4"]
  source: schwesyg2011
- term: GRIIRA
  definition: "Green-induced infrared absorption: transient infrared absorption created by green light, from electrons trapped as bound small polarons."
  sections: ["4.4"]
  source: furukawa2001
- term: BLIIRA
  definition: "Blue-light-induced infrared absorption: the same effect induced by blue light, often in picosecond pulsed frequency conversion."
  sections: ["4.4"]
  source: hirohashi2007
- term: dark trace
  definition: "Gray coloration in the visible left by intense pulsed light; stable in congruent LN, decays within minutes in Mg- or Zn-doped crystals above threshold. Also gray track or gray trace."
  sections: ["4.4", "4.5"]
  source: volk2008
- term: optical-damage-resistant ion
  abbr: ODRI
  definition: "Dopant (Mg, Zn, In, Sc, Hf, Zr) that above a threshold concentration suppresses photorefraction, mainly by raising photoconductivity."
  sections: ["4.2"]
  source: volk2008
- term: threshold concentration
  definition: "Dopant level above which photorefraction and GRIIRA collapse, interpreted as the point where Nb antisites are fully replaced."
  sections: ["4.2", "4.4"]
  source: volk2008
- term: congruent lithium niobate
  abbr: CLN
  definition: "Composition at which melt and crystal have the same Li:Nb ratio; Li-deficient relative to 50:50."
  sections: ["4.2", "4.9"]
- term: near-stoichiometric lithium niobate
  abbr: NSLN
  definition: "Crystal close to the 50:50 Li:Nb ratio, grown from Li-rich or K2O-modified melts or made by vapor transport equilibration."
  sections: ["4.2", "4.9"]
- term: vapor transport equilibration
  abbr: VTE
  definition: "Annealing a crystal in Li-rich vapor to raise its Li content toward stoichiometry."
  sections: ["4.2", "4.9"]
- term: laser-induced damage
  definition: "Irreversible mechanical destruction (optical breakdown) at very high pulsed intensity or fluence; separate from photorefraction."
  sections: ["4.5"]
  source: volk2008
- term: pyroelectric coefficient
  abbr: p3
  definition: "Rate of change of spontaneous polarization with temperature, dPs/dT; negative in LiNbO3."
  sections: ["4.6"]
  source: savage1966
- term: spontaneous polarization
  abbr: Ps
  definition: "Built-in electric polarization of a ferroelectric along its polar axis (c in LiNbO3)."
  sections: ["4.6"]
  source: gopalan1998
- term: +c face (+z face)
  definition: "Polar face that becomes negative on compression and positive on cooling (IRE 1949, IEEE Std 176-1987 convention)."
  sections: ["4.6"]
  source: weis1985
- term: pyroelectric field
  abbr: E_pyro
  definition: "Field from uncompensated bound charge after a temperature change; decays as free charge screens it."
  sections: ["4.6"]
  source: schwesyg2011
- term: DC drift
  definition: "Slow change of a modulator's operating point under constant bias, caused by redistribution of mobile charge that screens the applied field. Also bias drift."
  sections: ["4.7"]
  source: yamada1981
- term: EO relaxation
  definition: "Decay of the electro-optic response at low frequency or long times; in TFLN it also enhances response in a kHz band."
  sections: ["4.7"]
  source: holzgrafe2024
- term: Maxwell-Wagner relaxation
  definition: "Relaxation in a layered dielectric whose layers differ in eps/sigma: voltage moves from capacitive to resistive division with time constant (C1+C2)/(G1+G2)."
  sections: ["4.7"]
- term: quadrature
  definition: "Bias point at half transmission of an MZM, where the transfer slope is largest."
  sections: ["4.7"]
- term: EO hysteresis
  definition: "Persistent change of DC electro-optic response magnitude and linearity after long biasing; reversible with zero or reverse bias."
  sections: ["4.7"]
  source: yeh2026
- term: ITO buffer
  definition: "Indium tin oxide, a transparent conductor, used in place of SiO2 as the buffer layer under modulator electrodes to reduce drift."
  sections: ["4.7"]
  source: gee1985
- term: TFLT
  definition: "Thin-film lithium tantalate (LiTaO3 on insulator), a sister platform with lower reported DC drift."
  sections: ["4.7"]
  source: powell2024
- term: thermo-optic coefficient
  abbr: dn/dT
  definition: "Change of refractive index per kelvin; in LiNbO3 several times larger for n_e than n_o."
  sections: ["4.8"]
  source: moretti2005
- term: thermal triangle
  definition: "Triangular resonance shape in a self-heated resonator when the laser is swept toward longer wavelength; a form of thermal bistability."
  sections: ["4.8", "4.3"]
  source: carmon2004
- term: thermal lens
  definition: "Lens formed by the temperature profile of an absorbing beam through dn/dT."
  sections: ["4.8"]
  source: schwesyg2011
- term: Li out-diffusion
  definition: "Loss of Li2O from the crystal surface at high temperature, leaving a Li-poor layer with higher n_e and lower Curie temperature."
  sections: ["4.9"]
  source: carruthers1974
- term: Ti indiffusion
  definition: "Diffusing a deposited Ti film into LiNbO3 at high temperature to raise the index and form waveguides."
  sections: ["4.9"]
  source: schmidt1974
- term: domain inversion layer
  definition: "Surface layer with reversed spontaneous polarization, formed for example on the +c face during Ti indiffusion."
  sections: ["4.9"]
  source: miyazawa1979
- term: discharge layer
  definition: "Thin conductive film (for example a few nm of Al) over resist on an insulating substrate that carries away charge during electron-beam lithography."
  sections: ["4.10"]
  source: blog-ebl-2024
- term: SNSPD
  definition: "Superconducting nanowire single-photon detector."
  sections: ["4.7"]
- term: PAM4
  definition: "Four-level pulse amplitude modulation, a line code carrying two bits per symbol."
  sections: ["4.7"]
- term: CTE
  definition: "Coefficient of thermal expansion."
  sections: ["4.10"]
- term: IDT
  definition: "Interdigital transducer, a comb electrode that launches surface acoustic waves on a piezoelectric."
  sections: ["4.10"]

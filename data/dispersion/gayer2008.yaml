  default: false

- id: gayer2008-mgo1-sln-e
  name: Gayer 2008, 1 mol% MgO:stoichiometric LiNbO3, extraordinary
  variant: mgo1-sln
  axis: e
  formula: *gform
  coefficients: {a1: 5.078, a2: 0.0964, a3: 0.2065, a4: 61.16, a5: 10.55, a6: 1.59e-2, b1: 4.677e-7, b2: 7.822e-8, b3: -2.653e-8, b4: 1.096e-4}
  lambda_unit: um
  valid_lambda_um: [0.5, 4.0]
  valid_T_C: [20, 200]
  temperature_dependent: true
  reference_T_C: 24.5
  errata: *gerrata
  check_values:
    - {lambda_nm: 1550, T_C: 24.5, n: 2.1258, tolerance: 0.00006, source: "computed from these coefficients (scripts/build_data.py regression value, 2026-10-25)"}
  provenance: {source_id: gayer2008, locator: "Table 1, p. 345; Table 1 caption: 1% MgO doped stoichiometric LiNbO3", status: P, research_note: "R14 rows 36, 36b", transcribed: "2026-10-25"}
  caveats:
    - "dn/dT from these coefficients: -7.1e-5 /K at 1550 nm (negative; R14 row 36c); do not use for absolute dn/dT."

# Zelmon, Small, Jundt 1997 Sellmeier models (21 C, 0.4-5.0 um). Schema: data/schema/dispersion.schema.json.
# Coefficients: refractiveindex.info (CC0) transcription, re-checked (R06 sec. 2.3). MgO5 rows with the 2026 erratum applied
# (o/e headings swapped in the 1997 Table 2). Check values: R06 sec. 2.4 (computed) and R14 rows 31-32 (compiled measurements).

- id: zelmon1997-cln-o
  name: Zelmon 1997, congruent LiNbO3, ordinary
  variant: cln
  axis: o
  formula: &zform
    form: sellmeier-3term
    latex: "n^2 - 1 = \\sum_{i=1}^{3} \\frac{B_i \\lambda^2}{\\lambda^2 - C_i}"
    expression: "n^2 - 1 = B1 L^2/(L^2 - C1) + B2 L^2/(L^2 - C2) + B3 L^2/(L^2 - C3), L in um"
    rii_formula: 2
  coefficients: {B1: 2.6734, C1: 0.01764, B2: 1.2290, C2: 0.05914, B3: 12.614, C3: 474.60}
  coefficient_units: &zunits {B1: "1", B2: "1", B3: "1", C1: "um2", C2: "um2", C3: "um2"}
  lambda_unit: um
  valid_lambda_um: [0.4, 5.0]
  valid_T_C: null
  temperature_dependent: false
  reference_T_C: 21
  errata: []
  check_values:
    - {lambda_nm: 632.8, T_C: 21, n: 2.2865, tolerance: 0.00006, source: "R06 sec. 2.4 (computed from these coefficients)"}
    - {lambda_nm: 1064, T_C: 21, n: 2.2321, tolerance: 0.00006, source: "R06 sec. 2.4 (computed)"}
    - {lambda_nm: 1550, T_C: 21, n: 2.2111, tolerance: 0.00006, source: "R06 sec. 2.4 (computed)"}
    - {lambda_nm: 632.8, T_C: 24.5, n: 2.2866, tolerance: 0.0005, source: "Nelson & Mikulyak 1974 via weis1985 Table 2 (R14 row 31); independent measurement"}
    - {lambda_nm: 1060, T_C: 24.5, n: 2.2323, tolerance: 0.0006, source: "Nelson & Mikulyak 1974 via weis1985 Table 2 (R14 row 32); independent measurement"}
  provenance: {source_id: zelmon1997, locator: "Table 2 (via refractiveindex.info LiNbO3 Zelmon-o)", status: P-db, via: rii, research_note: "R06 sec. 2.3 (re-checked)", transcribed: "2026-10-25"}
  default: true


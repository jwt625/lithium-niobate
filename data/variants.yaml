# Material variants. Schema: data/schema/variant.schema.json. Codes per research note R06 (status key, variant codes).
- id: cln
  name: Congruent LiNbO3 (CLN)
  material: LiNbO3
  description: Congruently melting composition, the standard commercial crystal.
  Li2O_mol_pct: "about 48.4-48.5 (48.38 in cti1999; 48.45 in volk2008)"
  dopant: null
  default: true
- id: sln
  name: Stoichiometric or near-stoichiometric LiNbO3 (SLN)
  description: Li2O content close to 50 mol%; values labelled near-SLN in volk2008 are stored here.
  Li2O_mol_pct: "about 49.7-50"
  dopant: null
- id: mgo5-cln
  name: 5 mol% MgO-doped congruent LiNbO3 (MgO5)
  description: Congruent LiNbO3 doped with 5 mol% MgO, above the photorefractive threshold (>= 4.5 at.% MgO, bryan1984).
  Li2O_mol_pct: "congruent melt"
  dopant: {element: Mg, compound: MgO, mol_pct: 5}
- id: mgo1-sln
  name: 1 mol% MgO-doped stoichiometric LiNbO3 (MgO1-SLN)
  description: Stoichiometric LiNbO3 doped with 1 mol% MgO, as labelled in gayer2008 Table 1.
  Li2O_mol_pct: "about 50"
  dopant: {element: Mg, compound: MgO, mol_pct: 1}
- id: unspecified
  name: Composition not stated
  description: The source does not state the composition (for example 1960s crystals or density used in a cell-volume calculation).
  Li2O_mol_pct: null
  dopant: null
- id: lt-saw
  name: LiTaO3, SAW-grade (comparison material)
  material: LiTaO3
  description: Lithium tantalate, the 3m sibling crystal of LiNbO3; commercial SAW-grade crystal as measured in kushibiki1999 (composition not recorded in the research notes).
  Li2O_mol_pct: null
  dopant: null
- id: lt-unspecified
  name: LiTaO3, composition not stated (comparison material)
  material: LiTaO3
  description: Lithium tantalate where the source does not state the composition (bulk 1965 crystal, or thin film).
  Li2O_mol_pct: null
  dopant: null

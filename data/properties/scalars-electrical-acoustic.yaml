# Scalar property records: electrical transport, photorefraction thresholds, acoustic velocities, hydrostatic piezo constant,
# and tensor components available only as partial sets. Schema: data/schema/scalar.schema.json.
# Sources: research notes R06 sec. 2.6-2.7, 2.10, 2.12-2.13; R14 sec. 2.4-2.6, 2.8; R08 sec. 3.2.

- id: dark-conductivity/cln/volk2008
  kind: scalar
  property: dark-conductivity
  name: Dark conductivity
  symbol: sigma_d
  category: electrical
  min: 1.0e-16
  max: 1.0e-14
  unit: {ucum: "S/m", display: "S/m"}
  variant: cln
  variant_note: "undoped or slightly doped CLN"
  conditions: {temperature_text: "room temperature, extrapolated from high temperature"}
  provenance: {source_id: volk2008, locator: "Sec. 3.2.1, pp. 59-60 (1e-16 to 1.0e-18 Ohm^-1 cm^-1)", status: P-comp, research_note: "R14 row 42", transcribed: "2026-10-25"}
  default: true
  notes: "Protonic conduction; activation energy about 1.1 eV (200-1000 C). 8-10 orders of magnitude below the 1.0e-6 S/m floor fitted in bouchy2022."

- id: dark-conductivity-activation-energy/cln/volk2008
  kind: scalar
  property: dark-conductivity-activation-energy
  name: Activation energy of dark (protonic) conductivity
  category: electrical
  value: 1.1
  uncertainty: {type: approximate}
  unit: {ucum: "eV", display: "eV"}
  variant: cln
  conditions: {temperature_text: "200-1000 C"}
  provenance: {source_id: volk2008, locator: "Sec. 3.2.1, pp. 59-60", status: P-comp, research_note: "R14 row 42", transcribed: "2026-10-25"}
  default: true

- id: maxwell-relaxation-time/cln/volk2008
  kind: scalar
  property: maxwell-relaxation-time
  name: Maxwell relaxation time (dark)
  symbol: tau_M
  category: electrical
  min: 5
  max: 500
  unit: {ucum: "d", display: "days"}
  variant: cln
  provenance: {source_id: volk2008, locator: "p. 159", status: P-comp, research_note: "R14 row 42a", transcribed: "2026-10-25"}
  default: true
  notes: "Internally inconsistent with volk2008's own sigma_d: tau = eps eps0 / sigma gives 0.3-29 days (eps = 28) or 0.9-86 days (eps = 84) (computed, R14 row 42a)."

- id: mgo-photorefractive-threshold/mgo5-cln/bryan1984
  kind: scalar
  property: mgo-photorefractive-threshold
  name: MgO concentration threshold for optical-damage resistance
  category: photorefractive
  value_text: ">= 4.5 at.% MgO"
  unit: {ucum: "%", display: "at.% MgO"}
  variant: mgo5-cln
  provenance: {source_id: bryan1984, locator: "abstract", status: P(abs), research_note: "R06 sec. 2.13", transcribed: "2026-10-25"}
  default: true
  notes: "Abstract: about 100x photoconductivity increase; activation energy 0.1 eV (resistant) vs 0.5 eV."


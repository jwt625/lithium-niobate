- id: hydrostatic-piezo-dh/unspecified/weis1985-graham1976
  kind: scalar
  property: hydrostatic-piezo-dh
  name: Hydrostatic piezoelectric coefficient d_h = 2 d31 + d33
  symbol: d_h
  category: acoustic
  value: 6.31
  uncertainty: {type: stated, value: 0.014}
  unit: {ucum: "pC/N", display: "pC/N"}
  variant: unspecified
  provenance: {source_id: weis1985, locator: "p. 198", status: P-comp, original_reference: "Graham, Ferroelectrics 10, 65 (1976); confirmed on 9 samples from 5 suppliers, Graham, J. Appl. Phys. 48, 2153 (1977)", research_note: "R14 row 60", transcribed: "2026-10-25"}
  default: true
  notes: "Implies d33 of about 8.0-8.4 pC/N with measured d31, favouring the kushibiki1999 set (d33 = 8.7, computed) over 6.0 and ruling out 12.5-16 (R14 row 60a)."


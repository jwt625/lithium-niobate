- id: pyroelectric-p3/unspecified/weis1985
  kind: scalar
  property: pyroelectric-p3
  name: Pyroelectric coefficient
  symbol: p_3
  category: thermal
  value: -4.0e-5
  unit: {ucum: "C/(m2.K)", display: "C/(m^2 K)"}
  variant: unspecified
  conditions: {temperature_text: "room temperature"}
  frame: {setting: "crystal-physics", x: "a axis, perpendicular to a mirror plane", y: "in a mirror plane", z: "polar c axis", handedness: right, convention: IRE-1949, z_sign_definition: "+c points out of the face that becomes negative on compression; equivalently it becomes positive on cooling (weis1985 pp. 192-193)"}
  provenance: {source_id: weis1985, locator: "Eq. (2), p. 196", status: P-comp, original_reference: "Savage, J. Appl. Phys. 37, 3071 (1966)", research_note: "R14 rows 28, 30", transcribed: "2026-10-25"}
  notes: "p3 < 0 means that on cooling the +c face becomes more positive (weis1985 p. 196). Magnitudes across sources span 4-9.5e-5 C/(m^2 K) (R14 row 28)."


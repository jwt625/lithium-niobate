# Tensor property records (point group 3m). Schema: data/schema/tensor.schema.json.
# Only independent components are stored; scripts/build_data.py generates the Voigt matrix, the full Cartesian tensor and the
# symmetry form, plus derived (status C) records: s^E and d from kushibiki1999. Sources: R06 sec. 2.6-2.11, R14 sec. 2.5-2.10.
# Spreads between sources are kept as separate records; nothing is blended.

- &frame_unstated_doc
  _anchor_only: true
  frame_unstated: &frame_unstated {setting: "crystal-physics", x: "a axis, perpendicular to a mirror plane", y: "in a mirror plane", z: "polar c axis", handedness: right, convention: unstated, z_sign_definition: "not stated in this record; tensor form matches this frame by symmetry (R06 sec. 3)"}
  frame_ire: &frame_ire {setting: "crystal-physics", x: "a axis, perpendicular to a mirror plane", y: "in a mirror plane", z: "polar c axis", handedness: right, convention: IRE-1949, z_sign_definition: "+c points out of the face that becomes negative on compression; equivalently it becomes positive on cooling (weis1985 pp. 192-193)"}
  u_rel: &u_rel {ucum: "1", qudt: "http://qudt.org/vocab/unit/UNITLESS", display: "relative (eps/eps0)"}
  u_gpa: &u_gpa {ucum: "GPa", qudt: "http://qudt.org/vocab/unit/GigaPA", display: "GPa"}
  u_s: &u_s {ucum: "10*-12.m2/N", display: "1e-12 m^2/N"}
  u_e: &u_e {ucum: "C/m2", qudt: "http://qudt.org/vocab/unit/C-PER-M2", display: "C/m^2"}
  u_d: &u_d {ucum: "pC/N", display: "pC/N"}
  u_r: &u_r {ucum: "pm/V", display: "pm/V"}
  u_p: &u_p {ucum: "1", qudt: "http://qudt.org/vocab/unit/UNITLESS", display: "-"}


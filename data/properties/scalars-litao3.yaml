# Comparison material: LiTaO3 (LT). Schema: data/schema/scalar.schema.json. Requested for LN vs LT figures.
# Only values with a recorded locator are included. Full LT elastic, piezoelectric and permittivity sets (kushibiki1999)
# are not yet transcribed: the research notes record only c14, and the full text was not re-read (open item).

- id: elastic-c14/lt-saw/kushibiki1999
  kind: scalar
  property: elastic-c14
  name: Elastic stiffness component c14 (constant E)
  symbol: c14^E
  category: acoustic
  tensor_component: c14
  value: -10.75
  unit: {ucum: "GPa", qudt: "http://qudt.org/vocab/unit/GigaPA", display: "GPa"}
  variant: lt-saw
  conditions: {electrical_boundary: E}
  provenance: {source_id: kushibiki1999, status: P, research_note: "R06 sec. 2.9 note", transcribed: "2026-10-25"}
  default: true
  notes: "In the same table and convention LiNbO3 has c14 = +7.83 GPa: the c14 sign differs between LN and LT (R06 sec. 2.9)."


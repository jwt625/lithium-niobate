      92, 219-221
    doi: 10.1515/zpch-1918-9212
    url: https://archive.org/details/sim_zeitschrift_physikalische_chemie_1917-04-24_92_2
  status: V
  chapter: 1
  era: A crystal on paper
  notes: 'Received 1916-08-19; Heft 2 ''Ausgegeben am 24. April 1917''; volume 92 spans 1916-11 to 1918-06, so Crossref and

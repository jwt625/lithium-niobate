# History events. Schema: data/schema/event.schema.json.
# Merge rule (2026-10-25):
#   1. Lane C07 (content/chapters/07-history/events.yaml, 162 events, Crossref- and byline-checked) is the primary source.
#      Its ids are kept, so manuscript cross-references resolve.
#   2. Rows of the earlier R07-based file are matched by DOI, else by year plus title-word overlap (Jaccard >= 0.25).
#      Matched rows take the C07 fields; 'significance' and 'tags' carry over from the R07 row; research_note names both.
#   3. Unmatched R07 rows stay (with C07 corrections applied where relevant, e.g. Czochralski 1917-04-24).
#   4. Status routing: V, P, S and derived are public (status shown with every event). C07 S rows whose notes say the basis
#      is a search snippet or search summary only become U. U rows appear only in /api/v1/unverified.json.
#   5. C07 ISO intervals (start/end) become date = start plus date_alt = end, date_approximate = true; 'approx' sets
#      date_approximate. C07 institution strings split on ';' into organizations; organizations_verified is true only when
#      the C07 notes say the affiliation was read on the byline.
- id: h-1801-hatchett-columbium
  kind: history
  date: '1801-11-26'
  date_precision: day
  title: Hatchett reports a new metal in a North American mineral and names it columbium
  hook: A London chemist finds an unknown metal in an American mineral and calls it columbium.
  people:
  - Charles Hatchett
  organizations:
  - Royal Society of London (paper read)
  organizations_verified: false
  citations:
  - text: C. Hatchett, Phil. Trans. R. Soc. Lond. 92, 49-66 (1802)
    doi: 10.1098/rstl.1802.0005
    url: https://archive.org/details/s3id13528400
  status: V
  chapter: 1
  era: A crystal on paper
  notes: 'Read 1801-11-26, printed 1802. Naming sentence p. 65: ''I have been induced to give it the name of Columbium.''
    Scan read on archive.org; Crossref record confirms volume and pages. The element is niobium; the name columbium persisted
    in US metallurgy.'
  research_note: C07 content/chapters/07-history/events.yaml
- id: h-1802-ekeberg-tantalum
  kind: history
  date: '1802'
  date_precision: year
  title: Ekeberg names tantalum after Tantalus
  hook: Tantalus could never drink; Ekeberg's new oxide could not take up acid, so he named it tantalum.
  people:
  - Anders Gustaf Ekeberg
  organizations:
  - Uppsala (attribution)
  organizations_verified: false
  citations:
  - text: Kongl. Vetenskaps Academiens Nya Handlingar 1802, p. 68 (as cited by Wollaston 1809 and Rose 1844)
  status: P
  chapter: 1
  era: A crystal on paper
  notes: 'Original Swedish paper not found online. The naming reason is as reported by Rose 1844 (Ann. Phys. 139, p. 318):
    the oxide is insoluble in excess acid, ''Wegen dieser Eigenschaft nannte er das ... Metall Tantal''.'
  research_note: C07 content/chapters/07-history/events.yaml

- id: h-1844-rose-niobium
  kind: history
  date: '1844-10-31'
  date_precision: day
  title: Heinrich Rose names niobium after Niobe, daughter of Tantalus
  hook: Niobium is named for Niobe, daughter of Tantalus, to mark its likeness to tantalum.
  people:
  - Heinrich Rose
  organizations:
  - Berlin (Royal Prussian Academy of Sciences, paper read)
  organizations_verified: false
  citations:
  - text: H. Rose, 'Ueber die Zusammensetzung der Tantalite und ein im Tantalite von Baiern enthaltenes neues Metall', Ann.
      Phys. Chem. (Poggendorff) 63 = Ann. Phys. 139, 317-341 (1844); Bericht Akad. Wiss. Berlin 1844, 361-364
    doi: 10.1002/andp.18441391006
    url: https://archive.org/details/annalenderphysi88pogggoog
  status: V
  chapter: 1
  era: A crystal on paper
  notes: 'Naming sentence pp. 335-336: ''Ich nenne dasselbe Niobium und sein Oxyd Niobsaure, von Niobe, der Tochter des Tantalus,
    um durch den Namen die Aehnlichkeit ... anzudeuten.'' Read to the Berlin Academy 1844-10-31 (Bericht scan, archive.org/details/BerichtUberDieZurBekanntmachung1844).
    Resolves the 1844 vs 1846 question: niobium 1844, pelopium 1846.'
  research_note: C07 content/chapters/07-history/events.yaml
